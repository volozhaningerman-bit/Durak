name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test
      - run: npm run build
      - run: node --check scripts/configure-telegram.mjs
      - run: node --check scripts/smoke-test.mjs
      - run: docker build -t durak-rpg:ci .
      - name: Smoke test production server
        run: |
          PORT=3100 npm start > /tmp/durak-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3100/health > /tmp/health.json; then
              break
            fi
            sleep 0.5
          done
          grep -q '"ok":true' /tmp/health.json
          curl -fsS http://127.0.0.1:3100/ | grep -q 'Durak RPG'
