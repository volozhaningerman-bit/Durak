services:
  - type: web
    name: durak-rpg-app
    runtime: static
    buildCommand: npm install && npm run build -w @durak/game-core && npm run build -w @durak/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_BACKEND_ORIGIN
        value: https://durak-rpg.onrender.com

  - type: web
    name: durak-rpg
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEBAPP_URL
        value: https://durak-rpg-app.onrender.com
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: durak-rpg-db
          property: connectionString
      - key: RECONNECT_GRACE_MS
        value: "60000"
      - key: PRIVATE_LOBBY_TTL_MS
        value: "3600000"

databases:
  - name: durak-rpg-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: durak
    user: durak
